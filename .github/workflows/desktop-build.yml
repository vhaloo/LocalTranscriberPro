name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags: ["v2.*", "v3.*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-14
            artifact: macos
          - os: ubuntu-24.04
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux audio runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install build tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install diarization pack (Windows CUDA runtime)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install torch==2.11.0+cu128 torchaudio==2.11.0+cu128 --index-url https://download.pytorch.org/whl/cu128
          python -m pip install -r requirements-diarization.txt openai-whisper==20250625
      - name: Install diarization and Apple acceleration
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements-macos.txt
      - name: Install diarization pack (Linux CPU fallback)
        if: runner.os == 'Linux'
        run: |
          python -m pip install torch==2.11.0+cpu torchaudio==2.11.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-diarization.txt openai-whisper==20250625
      - name: Resolve and validate release version
        shell: python {0}
        run: |
          import os
          import sys
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from src import __version__
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              assert os.environ["GITHUB_REF_NAME"].removeprefix("v") == __version__
          with open(os.environ["GITHUB_ENV"], "a") as handle:
              handle.write(f"APP_VERSION={__version__}\n")
      - name: Generate icons
        run: |
          python scripts/generate_brand_assets.py
          python scripts/prepare_js_runtime.py
          python scripts/prepare_default_voices.py
      - name: Validate before packaging
        run: |
          python -m compileall -q main.py src
          python -m ruff check main.py src tests scripts
          python scripts/check_release_docs.py
          python -m pytest
      - name: Build application
        run: python -m PyInstaller --clean --noconfirm --distpath dist/${{ env.APP_VERSION }} packaging/LocalTranscriberPro.spec
      - name: Validate frozen application on Windows
        if: runner.os == 'Windows'
        run: |
          python scripts/verify_frozen_source.py dist/${{ env.APP_VERSION }}/LocalTranscriberPro/LocalTranscriberPro.exe
          python scripts/validate_frozen.py dist/${{ env.APP_VERSION }}/LocalTranscriberPro/LocalTranscriberPro.exe
      - name: Validate frozen application on macOS/Linux
        if: runner.os != 'Windows'
        run: python scripts/validate_frozen.py dist/${{ env.APP_VERSION }}/LocalTranscriberPro/LocalTranscriberPro
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $version = $env:APP_VERSION
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\installer.iss
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          VERSION="$APP_VERSION"
          mkdir -p artifacts dmg-root
          cp -R "dist/${APP_VERSION}/Local Transcriber Pro.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          codesign --force --deep --sign - "dmg-root/Local Transcriber Pro.app"
          hdiutil create -volname "Local Transcriber Pro" -srcfolder dmg-root -ov -format UDZO "artifacts/LocalTranscriberPro-${VERSION}-macOS.dmg"
      - name: Package Linux AppImage and archive
        if: runner.os == 'Linux'
        run: |
          VERSION="$APP_VERSION"
          mkdir -p artifacts AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -R "dist/${APP_VERSION}/LocalTranscriberPro" AppDir/usr/bin/
          cp packaging/linux/localtranscriberpro.desktop AppDir/
          cp packaging/linux/localtranscriberpro.desktop AppDir/usr/share/applications/
          cp packaging/linux/AppRun AppDir/AppRun
          cp assets/icon.png AppDir/localtranscriberpro.png
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/localtranscriberpro.png
          chmod +x AppDir/AppRun AppDir/usr/bin/LocalTranscriberPro/LocalTranscriberPro
          curl -L -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "artifacts/LocalTranscriberPro-${VERSION}-Linux-x86_64.AppImage"
          tar -C "dist/${APP_VERSION}" -czf "artifacts/LocalTranscriberPro-${VERSION}-Linux-x86_64.tar.gz" LocalTranscriberPro
      - name: Check release asset size limit
        shell: python {0}
        run: |
          from pathlib import Path
          assets = [path for path in Path("artifacts").iterdir()
                    if path.name.endswith(("-Setup.exe", ".dmg", ".AppImage", ".tar.gz"))]
          assert assets, "No installer produced"
          for path in assets:
              assert 0 < path.stat().st_size < 2 * 1024 ** 3, f"GitHub release asset must be under 2 GiB: {path}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-package
          path: |
            artifacts/*-Setup.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v2.') || startsWith(github.ref, 'refs/tags/v3.')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*-package"
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists; preserving its validated assets."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --draft --title "Local Transcriber Pro ${GITHUB_REF_NAME}"
