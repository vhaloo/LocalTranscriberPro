name: Check experimental desktop packages

on:
  workflow_dispatch:
    inputs:
      macos_run_id:
        description: Successful desktop build run containing macos-package
        required: true
      linux_run_id:
        description: Successful desktop build run containing linux-x64-package
        required: true
      release_tag:
        description: Optional existing draft release to receive verified Mac/Linux assets
        required: false
        default: ""
      windows_staging_tag:
        description: Optional internal draft containing a checksummed Windows upload split into parts
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package verification tools
        run: python -m pip install faster-whisper==1.2.1 av==18.0.0 requests platformdirs "pyinstaller>=6.20,<7"
      - name: Install Linux audio runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ runner.os == 'macOS' && inputs.macos_run_id || inputs.linux_run_id }}
          name: ${{ runner.os == 'macOS' && 'macos-package' || 'linux-x64-package' }}
          path: packages
      - name: Verify mounted macOS disk image and bundled application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          image="$(find packages -maxdepth 1 -name '*.dmg' -print -quit)"
          hdiutil verify "$image"
          mount="$RUNNER_TEMP/localtranscriberpro-dmg"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$image"
          trap 'hdiutil detach "$mount" || hdiutil detach -force "$mount"' EXIT
          app="$mount/Local Transcriber Pro.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(/usr/bin/lipo -archs "$app/Contents/MacOS/LocalTranscriberPro")" = arm64
          python scripts/verify_frozen_source.py "$app/Contents/MacOS/LocalTranscriberPro"
          python scripts/validate_frozen.py "$app/Contents/MacOS/LocalTranscriberPro"
      - name: Verify extracted Linux AppImage and portable archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          image="$(realpath "$(find packages -maxdepth 1 -name '*.AppImage' -print -quit)")"
          chmod +x "$image"
          cd "$RUNNER_TEMP"
          "$image" --appimage-extract > appimage-extraction.log
          cd "$GITHUB_WORKSPACE"
          portable="$RUNNER_TEMP/localtranscriberpro-portable"
          mkdir -p "$portable"
          tar -xzf "$(find packages -maxdepth 1 -name '*.tar.gz' -print -quit)" -C "$portable"
          binary="$RUNNER_TEMP/squashfs-root/usr/bin/LocalTranscriberPro/LocalTranscriberPro"
          cmp "$binary" "$portable/LocalTranscriberPro/LocalTranscriberPro"
          python scripts/verify_frozen_source.py "$binary"
          python scripts/validate_frozen.py "$RUNNER_TEMP/squashfs-root/AppRun"
      - name: Keep package verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-experimental-package-verification
          path: |
            artifacts/packaged-smoke/report-*.json
            artifacts/frozen-source-proof.json
          if-no-files-found: ignore

  attach-to-draft:
    if: inputs.release_tag != ''
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      WINDOWS_STAGING_TAG: ${{ inputs.windows_staging_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.macos_run_id }}
          name: macos-package
          path: packages
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.linux_run_id }}
          name: linux-x64-package
          path: packages
      - name: Reassemble an optional staged Windows upload
        if: inputs.windows_staging_tag != ''
        shell: python {0}
        run: |
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from src import __version__

          repo = os.environ["GITHUB_REPOSITORY"]
          staging = os.environ["WINDOWS_STAGING_TAG"]
          assert staging.startswith(f"internal-windows-{__version__}-")
          def api(path, binary=False):
              command = ["gh", "api", f"repos/{repo}/{path}"]
              if binary:
                  command += ["-H", "Accept: application/octet-stream"]
              result = subprocess.run(command, check=True, capture_output=True)
              return result.stdout if binary else json.loads(result.stdout)

          matches = [item for item in api("releases?per_page=100") if item["tag_name"] == staging]
          assert len(matches) == 1 and matches[0]["draft"]
          assets = {item["name"]: item for item in matches[0]["assets"]}
          for attempt in range(40):
              if "windows-parts.json" in assets:
                  break
              print("Waiting for the verified Windows part manifest", flush=True)
              time.sleep(30)
              current = api(f"releases/{matches[0]['id']}")
              assert current["draft"] and current["tag_name"] == staging
              assets = {item["name"]: item for item in current["assets"]}
          metadata_asset = assets["windows-parts.json"]
          assert metadata_asset["state"] == "uploaded" and 0 < metadata_asset["size"] <= 128 * 1024
          raw = api(f"releases/assets/{metadata_asset['id']}", binary=True)
          assert len(raw) == metadata_asset["size"]
          assert metadata_asset["digest"] == "sha256:" + hashlib.sha256(raw).hexdigest()
          manifest = json.loads(raw)
          filename = f"LocalTranscriberPro-{__version__}-Windows-x64-Setup.exe"
          assert manifest["filename"] == filename and manifest["version"] == __version__
          assert 0 < manifest["bytes"] < 2 * 1024 ** 3
          assert re.fullmatch(r"[a-f0-9]{64}", manifest["sha256"])
          parts = manifest["parts"]
          assert 1 <= len(parts) <= 32
          assert sum(part["bytes"] for part in parts) == manifest["bytes"]
          for index, part in enumerate(parts):
              assert part["name"] == f"windows-{__version__}.part-{index:03}.bin"
              assert 0 < part["bytes"] <= 128 * 1024 ** 2
              assert re.fullmatch(r"[a-f0-9]{64}", part["sha256"])
              remote = assets[part["name"]]
              assert remote["state"] == "uploaded" and remote["size"] == part["bytes"]
              assert remote["digest"] == "sha256:" + part["sha256"]
          temporary = Path("packages") / (filename + ".part")
          destination = Path("packages") / filename
          assert not destination.exists() and not temporary.exists()
          total_hash = hashlib.sha256()
          with temporary.open("xb") as output:
              for part in parts:
                  asset_id = int(assets[part["name"]]["id"])
                  command = ["gh", "api", f"repos/{repo}/releases/assets/{asset_id}",
                             "-H", "Accept: application/octet-stream"]
                  process = subprocess.Popen(command, stdout=subprocess.PIPE)
                  count, digest = 0, hashlib.sha256()
                  while chunk := process.stdout.read(1024 * 1024):
                      count += len(chunk)
                      if count > part["bytes"]:
                          process.terminate()
                          raise ValueError("Staged part exceeds its declared size")
                      digest.update(chunk)
                      total_hash.update(chunk)
                      output.write(chunk)
                  assert process.wait() == 0
                  assert count == part["bytes"] and digest.hexdigest() == part["sha256"]
          assert temporary.stat().st_size == manifest["bytes"]
          assert total_hash.hexdigest() == manifest["sha256"]
          temporary.replace(destination)
      - name: Attach exact inspected packages to an existing draft
        shell: python {0}
        run: |
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from src import __version__
          from src.updater import expected_checksum

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          assert tag == "v" + __version__, "Draft tag must match the checked application"
          def api(path, binary=False):
              command = ["gh", "api", f"repos/{repo}/{path}"]
              if binary:
                  command += ["-H", "Accept: application/octet-stream"]
              result = subprocess.run(command, check=True, capture_output=True)
              return result.stdout if binary else json.loads(result.stdout)

          matches = [item for item in api("releases?per_page=100") if item["tag_name"] == tag]
          assert len(matches) == 1 and matches[0]["draft"], "Only an existing draft may be modified"
          release = matches[0]
          assert not release["prerelease"]
          assets = {item["name"]: item for item in release["assets"]}
          manifest_asset = assets["SHA256SUMS.txt"]
          assert manifest_asset["state"] == "uploaded" and manifest_asset["size"] < 256 * 1024
          manifest_bytes = api(f"releases/assets/{manifest_asset['id']}", binary=True)
          assert len(manifest_bytes) == manifest_asset["size"]
          assert manifest_asset["digest"] == "sha256:" + hashlib.sha256(manifest_bytes).hexdigest()
          manifest = manifest_bytes.decode("utf-8-sig")
          names = [f"LocalTranscriberPro-{__version__}-macOS-arm64-experimental.dmg",
                   f"LocalTranscriberPro-{__version__}-Linux-x86_64-experimental.AppImage",
                   f"LocalTranscriberPro-{__version__}-Linux-x86_64-experimental.tar.gz"]
          if os.environ["WINDOWS_STAGING_TAG"]:
              names.append(f"LocalTranscriberPro-{__version__}-Windows-x64-Setup.exe")
          assert {path.name for path in Path("packages").iterdir()} == set(names)
          proof = []
          for name in names:
              path = Path("packages") / name
              assert path.is_file() and 0 < path.stat().st_size < 2 * 1024 ** 3
              digest = hashlib.file_digest(path.open("rb"), "sha256").hexdigest()
              assert digest == expected_checksum(manifest, name), name
              old = assets.get(name)
              if old is None:
                  subprocess.run(["gh", "release", "upload", tag, str(path), "--repo", repo], check=True)
              current = api(f"releases/{release['id']}")
              assert current["draft"] and current["tag_name"] == tag
              remote = next(item for item in current["assets"] if item["name"] == name)
              assert remote["state"] == "uploaded" and remote["size"] == path.stat().st_size
              assert remote["digest"] == "sha256:" + digest
              proof.append({"name": name, "bytes": remote["size"], "sha256": digest})
          Path("verified-draft-assets.json").write_text(json.dumps(proof, indent=2), encoding="utf-8")
      - uses: actions/upload-artifact@v4
        with:
          name: verified-experimental-draft-assets
          path: verified-draft-assets.json
          if-no-files-found: error
